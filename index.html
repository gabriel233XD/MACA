<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor de Calidad de Aire - ESP32</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 1rem;
    }

    .status-badge {
      font-size: 0.85rem;
      background: #022c22;
      color: var(--success);
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      border: 1px solid var(--success);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .card h3 {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .card .value {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
    }

    .card .unit {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 0.3rem;
    }

    .status-text {
      font-weight: 700;
      display: inline-block;
      margin-top: 0.2rem;
    }

    .chart-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Monitor de Calidad del Aire</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">ESP32 + Sharp GP2Y1010AU0F</p>
      </div>
      <span class="status-badge" id="live-indicator">● En vivo</span>
    </header>

    <div class="grid">
      <div class="card">
        <h3>Densidad de Polvo</h3>
        <div class="value"><span id="val-dust">--</span><span class="unit">µg/m³</span></div>
      </div>

      <div class="card">
        <h3>Voltaje del Sensor</h3>
        <div class="value"><span id="val-volt">--</span><span class="unit">V</span></div>
      </div>

      <div class="card">
        <h3>Calidad del Aire</h3>
        <div class="value status-text" id="val-status">--</div>
      </div>
    </div>

    <div class="chart-container">
      <h3 style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem; text-transform: uppercase;">Historial de Partículas Recientes</h3>
      <canvas id="dustChart" height="90"></canvas>
    </div>
  </div>

  <script>
    const FIREBASE_URL = "https://esp32-f0a2a-default-rtdb.firebaseio.com/lecturas_aire.json";

    // Inicializar Gráfica con Chart.js
    const ctx = document.getElementById('dustChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Polvo (µg/m³)',
          data: [],
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.1)',
          borderWidth: 2,
          tension: 0.3,
          fill: true
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
          y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }, beginAtZero: true }
        }
      }
    });

    async function actualizarDatos() {
      try {
        const response = await fetch(FIREBASE_URL);
        const data = await response.json();
        if (!data) return;

        // Extraer las claves autogeneradas por el HTTP POST
        const keys = Object.keys(data);
        if (keys.length === 0) return;

        // Obtener el último dato registrado
        const lastKey = keys[keys.length - 1];
        const lastReading = data[lastKey];

        // 1. Actualizar Tarjetas
        const dust = parseFloat(lastReading.polvo_ugm3 || 0);
        const volt = parseFloat(lastReading.voltaje_v || 0);
        const status = lastReading.estado || "Desconocido";

        document.getElementById('val-dust').innerText = dust.toFixed(1);
        document.getElementById('val-volt').innerText = volt.toFixed(2);
        
        const statusEl = document.getElementById('val-status');
        statusEl.innerText = status;

        // Colores según el estado
        if (dust < 35) {
          statusEl.style.color = "var(--success)";
        } else if (dust < 100) {
          statusEl.style.color = "var(--warning)";
        } else {
          statusEl.style.color = "var(--danger)";
        }

        // 2. Actualizar Gráfica con los últimos 10 puntos
        const ultimasClaves = keys.slice(-10);
        chart.data.labels = ultimasClaves.map((_, index) => `Punto ${index + 1}`);
        chart.data.datasets[0].data = ultimasClaves.map(k => data[k].polvo_ugm3);
        chart.update();

      } catch (err) {
        console.error("Error al consultar Firebase:", err);
      }
    }

    // Consultar cada 3 segundos
    setInterval(actualizarDatos, 3000);
    actualizarDatos();
  </script>
</body>
</html>
